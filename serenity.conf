webdriver {
  driver = chrome
  autodownload = true
}

headless.mode = false

environments {
  default {
    webdriver.base.url = "https://www.saucedemo.com/"
  }
}

serenity {
  project.name = "Sauce Demo - Automatizacion de compra"
  take.screenshots = FOR_EACH_ACTION
}

chrome.switches = "--start-maximized;--disable-popup-blocking;--disable-extensions;--remote-allow-origins=*"
